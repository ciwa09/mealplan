const mealPlan = [...weekOneMealPlan, ...extraMealPlan].map((entry, index) => ({
  ...entry,
  breakfast: breakfastOptions[index % breakfastOptions.length],
  templateDay: entry.day,
  day: `Day ${index + 1}`
}));

function hasNonVegLunch(day) {
  const tags = day.lunch.tags.join(" ").toLowerCase();
  const name = day.lunch.name.toLowerCase();
  return tags.includes("non-veg") || ["chicken", "fish", "prawn"].some(word => name.includes(word));
}

const vegetarianMealTemplates = mealPlan.map((day, index) => ({ day, index })).filter(template => !hasNonVegLunch(template.day));
const nonVegMealTemplates = mealPlan.map((day, index) => ({ day, index })).filter(template => hasNonVegLunch(template.day));

const defaultPlanStartDate = "2026-05-30";

function toDateInputValue(date) {
  const year = date.getFullYear();
  const month = String(date.getMonth() + 1).padStart(2, "0");
  const day = String(date.getDate()).padStart(2, "0");
  return `${year}-${month}-${day}`;
}

function getTodayDateInput() {
  return toDateInputValue(new Date());
}

function getSavedPlanStartDate() {
  return window.localStorage.getItem("indiaMealPlanStartDate") || defaultPlanStartDate;
}

function savePlanStartDate(dateValue) {
  window.localStorage.setItem("indiaMealPlanStartDate", dateValue);
}

function parseLocalDate(dateValue) {
  const [year, month, day] = dateValue.split("-").map(Number);
  return new Date(year, month - 1, day);
}

function getPlanDate(startDate, index) {
  const date = parseLocalDate(startDate);
  date.setDate(date.getDate() + index);
  return date;
}

function formatPlanDate(startDate, index, options) {
  return new Intl.DateTimeFormat("en-US", options).format(getPlanDate(startDate, index));
}

function getPlanDateTitle(startDate, index) {
  return `${formatPlanDate(startDate, index, { weekday:"long" })}, ${formatPlanDate(startDate, index, { month:"short", day:"numeric", year:"numeric" })}`;
}

function isWednesdayOrSunday(startDate, index) {
  const weekday = getPlanDate(startDate, index).getDay();
  return weekday === 0 || weekday === 3;
}

function getMonthDayCount(startDate) {
  const date = parseLocalDate(startDate);
  return new Date(date.getFullYear(), date.getMonth() + 1, 0).getDate();
}

function getCalendarMealPlan(startDate) {
  const dayCount = getMonthDayCount(startDate);
  let vegetarianIndex = 0;
  let nonVegIndex = 0;
  return Array.from({ length: dayCount }, (_, index) => {
    const useNonVegTemplate = isWednesdayOrSunday(startDate, index);
    const source = useNonVegTemplate
      ? nonVegMealTemplates[nonVegIndex++ % nonVegMealTemplates.length]
      : vegetarianMealTemplates[vegetarianIndex++ % vegetarianMealTemplates.length];
    const template = source.day;
    return {
      ...template,
      breakfast: breakfastOptions[index % breakfastOptions.length],
      day: `Day ${index + 1}`,
      templateDay: template.templateDay,
      templateIndex: source.index,
      scheduledNonVegDay: useNonVegTemplate
    };
  });
}

function getDisplayMealPlan(vegetarianMode, startDate) {
  const calendarMealPlan = getCalendarMealPlan(startDate);
  if (!vegetarianMode) return calendarMealPlan;
  return calendarMealPlan.map(day => {
    const replacement = vegetarianLunchReplacements[day.templateIndex];
    if (!replacement) return day;
    return { ...day, theme: "Light Veg", lunch: replacement, vegetarianSwap: true };
  });
}

function getNonVegDayCountForRange(startDate, startDay, endDay) {
  let count = 0;
  for (let day = startDay; day <= endDay; day += 1) {
    if (isWednesdayOrSunday(startDate, day - 1)) count += 1;
  }
  return count;
}

function getNonVegShoppingItems(nonVegMealCount) {
  if (nonVegMealCount === 0) return ["None needed for these days"];
  if (nonVegMealCount === 1) return ["Chicken or local fish for 1 Wednesday/Sunday lunch"];
  return ["Chicken for Wednesday lunch", "Local fish or prawns for Sunday lunch"];
}

function getShoppingWeeksForStartDate(startDate) {
  const dayCount = getMonthDayCount(startDate);
  const weekCount = Math.ceil(dayCount / 7);
  return weeklyShoppingLists.slice(0, weekCount).map((week, index) => {
    const startDay = index * 7 + 1;
    const endDay = Math.min((index + 1) * 7, dayCount);
    const nonVegMealCount = getNonVegDayCountForRange(startDate, startDay, endDay);
    const items = {
      ...week.items,
      "Non-veg twice weekly": getNonVegShoppingItems(nonVegMealCount)
    };
    return { ...week, days: `Days ${startDay}-${endDay}`, items };
  });
}

function getShoppingItemsForMode(items, activeWeek, vegetarianMode) {
  if (!vegetarianMode) return items;
  return Object.fromEntries(Object.entries(items).map(([category, categoryItems]) => (
    category === "Non-veg twice weekly"
      ? ["Vegetarian swaps", vegetarianShoppingSwaps[activeWeek] || ["Paneer", "Chana", "Soya chunks"]]
      : [category, categoryItems]
  )));
}

function getBeginnerGuide(meal, type) {
  const text = `${meal.name} ${(meal.tags || []).join(" ")} ${meal.items.join(" ")}`.toLowerCase();
  const has = words => words.some(word => text.includes(word));
  const guide = {
    equipment: "Gas stove, knife, board, measuring cups/spoons",
    prep: ["Chop vegetables and measure rice, dal, oil, curd and chutney before cooking."],
    cues: ["Cook mostly on medium heat and taste for salt near the end."]
  };

  if (has(["dosa", "pesarattu", "adai", "uttapam", "roti", "chapati", "phulka", "tawa", "akki"])) {
    guide.equipment = "Tawa, spatula, ladle, small oil spoon";
    guide.prep.push("Heat the tawa well before adding batter or roti.");
    guide.cues.push("Use only a few drops of oil; dosa edges should lift easily and rotis should get light brown spots.");
  }

  if (has(["idli", "idiyappam", "steamer"])) {
    guide.equipment = "Idli steamer or pressure cooker without whistle, idli plates, ladle";
    guide.prep.push("Grease plates lightly and start water boiling before pouring batter.");
    guide.cues.push("Steam on medium heat; idlis are done when the top is springy and a spoon comes out clean.");
  }

  if (has(["dal", "pappu", "sambar", "khichdi", "pongal", "rasam", "kadhi", "charu"])) {
    guide.equipment = "Pressure cooker, tempering pan, ladle, measuring cups";
    guide.prep.push("Rinse dal 2 to 3 times before pressure cooking.");
    guide.cues.push("Let pressure release naturally; dal should mash easily before tempering.");
  }

  if (has(["rice", "pulao", "pulihora", "lemon rice", "tomato rice", "bisi bele", "curd rice"])) {
    guide.equipment = "Rice cooker or pressure cooker, kadai, measuring cup";
    guide.prep.push("Rinse rice until the water runs mostly clear.");
    guide.cues.push("For mixed rice, cool cooked rice briefly so it does not become mushy.");
  }

  if (has(["curry", "poriyal", "fry", "palya", "kootu", "kurma", "saagu", "sagu", "bhurji", "sundal"])) {
    guide.equipment = "Kadai, spatula, lid, measuring spoon";
    guide.prep.push("Chop vegetables into similar sizes so they cook evenly.");
    guide.cues.push("Cook masala until the raw smell is gone and vegetables are tender but not mushy.");
  }

  if (has(["chicken", "fish", "prawn", "non-veg"])) {
    guide.prep.push("Keep raw meat or fish separate from vegetables and wash the board/knife after use.");
    guide.cues.push("Chicken should be opaque inside; fish should flake gently; prawns should turn pink and firm.");
  }

  if (type === "breakfast") {
    guide.prep.push("For kids, keep fruit or milk ready before serving breakfast.");
  }

  return guide;
}

          <div key={meal.name} className="section-card" style={{ borderLeft:`5px solid ${colors.accent}` }}>
            <div style={{ display:"flex", alignItems:"center", gap:8, flexWrap:"wrap", marginBottom:8 }}>
              <span style={{ fontSize:11, fontWeight:900, color:colors.accent, background:colors.badge, borderRadius:6, padding:"3px 9px", letterSpacing:0.8 }}>{index === 0 ? "BREAKFAST" : index === 1 ? "LUNCH" : "DINNER"}</span>
              <span style={{ fontSize:11, color:"#667085", fontWeight:800 }}>{meal.time}</span>
            </div>
            <div style={{ fontFamily:"'Playfair Display',serif", fontSize:20, fontWeight:900, marginBottom:8 }}>{meal.name}</div>
            <p style={{ fontSize:13, color:"#4b5563", lineHeight:1.65, fontStyle:"italic", marginBottom:14 }}>{meal.recipe.intro}</p>
            <BeginnerGuide meal={meal} type={index === 0 ? "breakfast" : index === 1 ? "lunch" : "dinner"} colors={colors} />
            <div className="muted-label">WHAT YOU NEED</div>
            <ul style={{ margin:0, paddingLeft:18, marginBottom:16 }}>
              {meal.items.map(item => <li key={item} style={{ fontSize:13, color:"#3f4654", marginBottom:4, lineHeight:1.5 }}>{item}</li>)}
            </ul>
            <div className="muted-label">HOW TO MAKE IT</div>
            <ol style={{ margin:0, paddingLeft:18 }}>
              {meal.recipe.steps.map((step, stepIndex) => <li key={stepIndex} style={{ fontSize:13, color:"#293241", marginBottom:9, lineHeight:1.65 }}>{step}</li>)}
            </ol>
            <div style={{ marginTop:14, background:colors.bg, borderRadius:10, padding:"10px 12px", borderLeft:`3px solid ${colors.accent}` }}>
              <span style={{ fontSize:12, color:colors.accent, fontWeight:900 }}>Helper note: </span>
              <span style={{ fontSize:12, color:"#4b5563", lineHeight:1.6 }}>{meal.recipe.helperNote}</span>
            </div>
          </div>
        ))}
      </div>
    </div>
  );
}

function PrepPage() {
  const notes = [
    { title:"Weekly dal prep", detail:"Cook plain toor dal and moong dal in batches. Finish each meal with fresh tempering so flavors do not get boring." },
    { title:"Recipe cooking notes", detail:"Each recipe includes short cookware, prep and cooking-cue notes before the main steps, for cooks who know the basics but want quick guidance." },
    { title:"Breakfast for family", detail:"Breakfast is included for kids and wife. You can skip breakfast and still use lunch plus dinner as your lighter personal plan." },
    { title:"Kids portions", detail:"Treat 1600 calories as the adult portion guide. Kids can add fruit, milk, curd, extra idli, dosa, chapati, rice or a small ghee serving based on hunger and activity." },
    { title:"Daily fruit and dairy", detail:"Keep one fruit daily for kids and 1 to 2 servings of milk, curd, buttermilk or paneer for calcium, protein and B12 support." },
    { title:"Vitamin D and B12 watch", detail:"Use iodized salt and add nuts or seeds if tolerated. Vitamin D and B12 may still need sunlight, labs or doctor-guided supplements, especially in vegetarian mode." },
    { title:"No oven or microwave needed", detail:"Every recipe uses gas stove, pressure cooker, kadai, tawa or idli steamer. Reheat in a small vessel on the stove." },
    { title:"Helper-friendly batching", detail:"Ask helpers to chop vegetables, boil chana, soak moong, make sambar base and keep curd ready. Keep oil and ghee measured." },
    { title:"Vegetarian mode", detail:"Use the Vegetarian switch to replace non-veg lunches with paneer, chana, rajma or soya versions while keeping the same South Indian meal style." },
    { title:"Meat limit", detail:"With Vegetarian off, each full week keeps non-veg to one or two lunches. The remaining meals use dal, sprouts, curd, millet and legumes for protein." },
    { title:"South India ingredient filter", detail:"Meals use common Andhra/Telangana ingredients: rice, dal, sambar vegetables, curd, ragi, jowar, idli batter, local greens, paneer, chana, chicken and local fish." }
  ];

  return (
    <div className="page-container">
      <div className="section-card" style={{ background:"linear-gradient(135deg,#182033,#2d2538)", color:"#fff" }}>
        <div style={{ fontFamily:"'Playfair Display',serif", fontSize:22, fontWeight:900, marginBottom:6 }}>Cooking Setup</div>
        <div style={{ fontSize:13, color:"#d6dde8", lineHeight:1.65 }}>Designed for Andhra Pradesh or Telangana kitchens with no microwave and no oven. A pressure cooker, kadai, tawa, mixer jar and idli steamer are enough.</div>
      </div>
      {notes.map(note => (
        <div key={note.title} className="section-card">
          <div style={{ fontFamily:"'Playfair Display',serif", fontSize:18, fontWeight:900, marginBottom:6 }}>{note.title}</div>
          <div style={{ fontSize:13, color:"#4b5563", lineHeight:1.7 }}>{note.detail}</div>
        </div>
      ))}

function ShoppingPage({ vegetarianMode, startDate }) {
  const [checked, setChecked] = useState({});
  const [activeWeek, setActiveWeek] = useState(0);
  const shoppingWeeks = getShoppingWeeksForStartDate(startDate);
  const activeWeekIndex = Math.min(activeWeek, shoppingWeeks.length - 1);
  const toggle = key => setChecked(prev => ({ ...prev, [key]: !prev[key] }));
  const baseWeek = shoppingWeeks[activeWeekIndex];
  const week = { ...baseWeek, items: getShoppingItemsForMode(baseWeek.items, activeWeekIndex, vegetarianMode) };
  const allItems = Object.values(week.items).flat();
  const checkedCount = allItems.filter((_, index) => checked[`week-${activeWeekIndex}-${index}`]).length;
  let globalItemIndex = 0;

  return (
    <div className="page-container">
      <div className="section-card">
        <div style={{ display:"flex", justifyContent:"space-between", gap:12, marginBottom:8 }}>
          <div>
            <div style={{ fontFamily:"'Playfair Display',serif", fontSize:18, fontWeight:900 }}>{week.label} Ingredients</div>
            <div style={{ fontSize:12, color:"#667085", fontWeight:800, marginTop:2 }}>{week.days}</div>
          </div>
          <div style={{ fontSize:14, fontWeight:900, color:"#c4592d" }}>{checkedCount}/{allItems.length}</div>
        </div>
        <div style={{ background:"#edf0f4", borderRadius:99, height:8, overflow:"hidden" }}>
          <div style={{ width:`${(checkedCount / allItems.length) * 100}%`, background:"linear-gradient(90deg,#c4592d,#287653)", height:"100%", borderRadius:99, transition:"width 0.25s" }} />
        </div>
      </div>

      <div style={{ display:"flex", gap:8, marginBottom:16, overflowX:"auto", scrollbarWidth:"none" }}>
        {shoppingWeeks.map((option, index) => (
          <button key={option.label} onClick={() => setActiveWeek(index)} style={{
            flex:"0 0 auto", padding:"8px 13px", borderRadius:20, border:"none", cursor:"pointer",
            background: activeWeekIndex === index ? "#182033" : "#fff",
            color: activeWeekIndex === index ? "#fff" : "#4b5563",
            boxShadow:"0 4px 12px rgba(23,32,51,0.08)", fontFamily:"inherit", fontWeight:900, fontSize:12
          }}>{option.label}</button>
        ))}
      </div>

      {Object.entries(week.items).map(([category, items]) => (
        <div key={category} className="section-card">
          <div style={{ fontFamily:"'Playfair Display',serif", fontSize:17, fontWeight:900, marginBottom:12 }}>{category}</div>
          {items.map((item, index) => {
            const key = `week-${activeWeekIndex}-${globalItemIndex++}`;
            const done = !!checked[key];
            return (
              <div key={item} onClick={() => toggle(key)} style={{ display:"flex", alignItems:"flex-start", gap:12, padding:"9px 0", borderBottom:index < items.length - 1 ? "1px solid #f0f2f5" : "none", cursor:"pointer", opacity:done ? 0.48 : 1 }}>
                <div style={{ width:20, height:20, borderRadius:6, border:`2px solid ${done ? "#287653" : "#c6ccd6"}`, background:done ? "#287653" : "#fff", display:"flex", alignItems:"center", justifyContent:"center", flexShrink:0, marginTop:1 }}>
                  {done && <span style={{ color:"#fff", fontSize:12, fontWeight:900 }}>✓</span>}
                </div>
                <div style={{ fontSize:13, color:"#293241", fontWeight:700, lineHeight:1.45, textDecoration:done ? "line-through" : "none" }}>{item}</div>
              </div>
            );
          })}
        </div>
      ))}
    </div>
  );
}

function App() {
  const [page, setPage] = useState("plan");
  const [vegetarianMode, setVegetarianMode] = useState(false);
  const [startDate, setStartDate] = useState(getSavedPlanStartDate);
  const planDayCount = getMonthDayCount(startDate);

  function handleStartDateChange(event) {
    const nextStartDate = event.target.value || defaultPlanStartDate;
    setStartDate(nextStartDate);
    savePlanStartDate(nextStartDate);
  }
  const tabs = [
    { id:"plan", label:"Plan" },
    { id:"recipes", label:"Recipes" },
    { id:"prep", label:"Prep" },
    { id:"shopping", label:"Ingredients" },
  ];

  return (
    <div className="app-shell">
      <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@700;900&family=Lato:wght@400;600;700;800;900&display=swap" rel="stylesheet" />

      <div className="app-header">
        <div className="header-inner">
          <div className="app-title">South India Meal Plan</div>
          <div className="app-subtitle">{planDayCount} DAYS · FAMILY BREAKFAST INCLUDED · ADULT 1600 KCAL MAX · KID ADD-ONS · ANDHRA / TELANGANA</div>
          <div className="mode-row">
            <div className="diet-toggle" role="group" aria-label="Meal preference">
              <button type="button" className={`diet-option veg ${vegetarianMode ? "active" : ""}`} onClick={() => setVegetarianMode(true)}>Vegetarian</button>
              <button type="button" className={`diet-option nonveg ${!vegetarianMode ? "active" : ""}`} onClick={() => setVegetarianMode(false)}>Non-vegetarian</button>
            </div>
          </div>
          <div className="calendar-row">
            <label className="date-control">
              <span>Start date</span>
              <input type="date" value={startDate} onChange={handleStartDateChange} />
            </label>
          </div>
          <div className="top-tabs">
            {tabs.map(tab => (
              <button key={tab.id} className="tab-button" onClick={() => setPage(tab.id)} style={{
                background: page === tab.id ? "#fffaf2" : "transparent",
                color: page === tab.id ? "#172033" : "#d6dde8"
              }}>{tab.label}</button>
            ))}
          </div>
        </div>
      </div>

      {page === "plan" && <PlanPage vegetarianMode={vegetarianMode} startDate={startDate} />}
      {page === "recipes" && <RecipesPage vegetarianMode={vegetarianMode} startDate={startDate} />}
      {page === "prep" && <PrepPage />}
      {page === "shopping" && <ShoppingPage vegetarianMode={vegetarianMode} startDate={startDate} />}
    </div>
  );
}

ReactDOM.createRoot(document.getElementById("root")).render(<App />);
  </script>
</body>
</html>
